// Brilliant-cut diamond: girdle 16, crown with table and star/kite facets, pavilion to culet.
function brilliant() {
  const g = [], ring = (n, r, y, rot = 0) => Array.from({ length: n }, (_, i) => {
    const a = rot + (i / n) * Math.PI * 2; return new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r) })
  const table = ring(8, 0.56, 0.17), star = ring(8, 0.8, 0.105, Math.PI / 8), girdle = ring(16, 1, 0)
  const girdleLow = ring(16, 1, -0.025), lower = ring(8, 0.5, -0.4, Math.PI / 8), culet = new THREE.Vector3(0, -0.86, 0)
  const top = new THREE.Vector3(0, 0.17, 0)
  const tri = (a, b, c) => g.push(a, b, c)
  for (let i = 0; i < 8; i++) {
    const t0 = table[i], t1 = table[(i + 1) % 8], s = star[i]
    tri(top, t1, t0); tri(t0, t1, s)                         // table + star facet
    const gA = girdle[2 * i], gB = girdle[2 * i + 1], gC = girdle[(2 * i + 2) % 16]
    const sPrev = star[(i + 7) % 8]
    tri(t0, s, gB); tri(t0, gB, sPrev)                        // kite (bezel) facets
    tri(s, gC, gB); tri(sPrev, gB, gA)                        // upper girdle facets
  }
  for (let i = 0; i < 16; i++) { const a = girdle[i], b = girdle[(i + 1) % 16], c = girdleLow[i], d = girdleLow[(i + 1) % 16]; tri(a, c, b); tri(b, c, d) }
  for (let i = 0; i < 8; i++) {
    const l = lower[i], gA = girdleLow[2 * i + 1], gB = girdleLow[(2 * i + 2) % 16], gP = girdleLow[2 * i]
    tri(gA, l, gB); tri(gP, l, gA)                            // lower girdle facets
    tri(l, culet, lower[(i + 1) % 8]); tri(l, lower[(i + 1) % 8], gB) // pavilion mains
  }
  const geo = new THREE.BufferGeometry().setFromPoints(g)
  geo.computeVertexNormals()
  return geo
}

function heartGeo() {
  const sh = new THREE.Shape()
  sh.moveTo(0, -1.0)
  sh.bezierCurveTo(-0.35, -0.68, -1.05, -0.28, -1.05, 0.28)
  sh.bezierCurveTo(-1.05, 0.78, -0.62, 1.02, -0.3, 1.0)
  sh.bezierCurveTo(-0.1, 0.99, 0.0, 0.82, 0.0, 0.66)
  sh.bezierCurveTo(0.0, 0.82, 0.1, 0.99, 0.3, 1.0)
  sh.bezierCurveTo(0.62, 1.02, 1.05, 0.78, 1.05, 0.28)
  sh.bezierCurveTo(1.05, -0.28, 0.35, -0.68, 0, -1.0)
  const g = new THREE.ExtrudeGeometry(sh, { depth: 0.32, bevelEnabled: true, bevelThickness: 0.28, bevelSize: 0.22, bevelSegments: 24, curveSegments: 96 })
  g.center(); g.computeVertexNormals(); return g
}
function starGeo() {
  const sh = new THREE.Shape()
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? 0.46 : 1.05, a = Math.PI / 2 + (i * Math.PI) / 5
    const x = Math.cos(a) * r, y = Math.sin(a) * r
    i ? sh.lineTo(x, y) : sh.moveTo(x, y)
  }
  sh.closePath()
  const g = new THREE.ExtrudeGeometry(sh, { depth: 0.16, bevelEnabled: true, bevelThickness: 0.2, bevelSize: 0.12, bevelSegments: 12, curveSegments: 4 })
  g.center(); g.computeVertexNormals(); return g
}

// ---------------------------------------------------------------- gem cuts (convex hull of the cut's vertices)
// Each outline maps an angle to a point on the unit girdle; rings of the brilliant pattern are scaled copies.
const vesica = (a, w) => { const c = (1 - w * w) / (2 * w), s = Math.abs(Math.sin(a)); const t = (-2 * c * s + Math.sqrt(4 * c * c * s * s + 4 * (2 * c * w + w * w))) / 2; return [Math.cos(a) * t, Math.sin(a) * t] }
const OUTLINES = {
  round: (a) => [Math.cos(a), Math.sin(a)],
  oval: (a) => [Math.cos(a), Math.sin(a) * 0.74],
  marquise: (a) => vesica(a, 0.5),
  pear: (a) => (Math.cos(a) >= 0 ? vesica(a, 0.62) : [Math.cos(a) * 0.66, Math.sin(a) * 0.62]),
  princess: (a) => { const t = 0.78 / Math.max(Math.abs(Math.cos(a)), Math.abs(Math.sin(a))); return [Math.cos(a) * t, Math.sin(a) * t] },
  trillion: (a) => { let m = 0; for (let k = 0; k < 3; k++) m = Math.max(m, Math.cos(a - Math.PI / 2 - (k * 2 * Math.PI) / 3)); const t = 0.5 / Math.pow(m, 0.8); return [Math.cos(a) * t, Math.sin(a) * t] }
}
function brilliantCut(outline, n = 16, depth = 1) {
  const pts = [], h = n / 2
  const ring = (count, s, y, rot = 0) => { for (let i = 0; i < count; i++) { const [x, z] = outline(rot + (i / count) * Math.PI * 2); pts.push(new THREE.Vector3(x * s, y, z * s)) } }
  ring(h, 0.56, 0.17); ring(h, 0.8, 0.105, Math.PI / h); ring(n, 1, 0); ring(n, 1, -0.025)
  ring(h, 0.5, -0.4 * depth, Math.PI / h); pts.push(new THREE.Vector3(0, -0.86 * depth, 0))
  return pts
}
function stepCut(w = 1, d = 0.68, corner = 0.2) {
  const pts = []
  const oct = (s, y) => { const hw = w * s, hd = d * s, c = corner * s
    for (const [x, z] of [[hw - c, hd], [hw, hd - c], [hw, -hd + c], [hw - c, -hd], [-hw + c, -hd], [-hw, -hd + c], [-hw, hd - c], [-hw + c, hd]]) pts.push(new THREE.Vector3(x, y, z)) }
  oct(1, 0); oct(1, -0.03); oct(0.9, 0.075); oct(0.8, 0.13)
  oct(0.84, -0.17); oct(0.62, -0.33); oct(0.38, -0.46)
  pts.push(new THREE.Vector3(-0.3 * w, -0.56, 0), new THREE.Vector3(0.3 * w, -0.56, 0))
  return pts
}
function gemGeo(cut) {
  const pts = cut === 'emerald' ? stepCut(1, 0.68, 0.2) : cut === 'baguette' ? stepCut(1, 0.34, 0.04)
    : brilliantCut(OUTLINES[cut], cut === 'round' ? 16 : 24, cut === 'princess' ? 0.92 : 1)
  const g = new ConvexGeometry(pts)
  g.center()
  return g
}


// A studio lit by `n` equal softboxes round the stone (an equirectangular picture): turned by 1/n of a turn
// it is the same, so a stone of the same symmetry turning by that much makes a seamless loop.
function studioRing({ n = 8, sky = '#f2f6ff', mid = '#7d93bf', floor = '#1c2742', box = '#ffffff', glow = '#4f9dff' }) {
  const c = document.createElement('canvas'); c.width = 2048; c.height = 1024
  const g = c.getContext('2d')
  const grad = g.createLinearGradient(0, 0, 0, 1024)
  grad.addColorStop(0, sky); grad.addColorStop(0.46, mid); grad.addColorStop(0.6, '#34466e'); grad.addColorStop(1, floor)
  g.fillStyle = grad; g.fillRect(0, 0, 2048, 1024)
  const W = 2048 / n
  for (let i = 0; i < n; i++) {
    const x = i * W
    // a tall white softbox above, a blue light lower down between them
    const sb = g.createLinearGradient(0, 150, 0, 420); sb.addColorStop(0, box); sb.addColorStop(1, 'rgba(255,255,255,0.75)')
    g.fillStyle = sb; g.fillRect(x + W * 0.3, 130, W * 0.4, 330)
    g.fillStyle = '#0a1226'; g.fillRect(x + W * 0.02, 160, W * 0.12, 340)
    g.fillStyle = glow; g.globalAlpha = 0.85; g.fillRect(x + W * 0.86, 470, W * 0.22, 90); g.globalAlpha = 1
    g.fillStyle = '#ffffff'; g.fillRect(x + W * 0.47, 40, W * 0.06, 60)
  }
  // the top of the studio: a broad soft light
  const top = g.createRadialGradient(1024, -200, 10, 1024, -200, 700); top.addColorStop(0, 'rgba(255,255,255,0.9)'); top.addColorStop(1, 'rgba(255,255,255,0)')
  g.fillStyle = top; g.fillRect(0, 0, 2048, 300)
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = THREE.RepeatWrapping
  return t
}

// Convex facet planes (object space) of a geometry: dot(n, x) = w, n pointing outward.
function facetPlanes(geo) {
  const pos = geo.attributes.position, planes = []
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3()
  for (let i = 0; i < pos.count; i += 3) {
    a.fromBufferAttribute(pos, i); b.fromBufferAttribute(pos, i + 1); c.fromBufferAttribute(pos, i + 2)
    const n = new THREE.Vector3().subVectors(b, a).cross(new THREE.Vector3().subVectors(c, a))
    if (n.lengthSq() < 1e-12) continue
    n.normalize()
    const centroid = a.clone().add(b).add(c).multiplyScalar(1 / 3)
    if (n.dot(centroid) < 0) n.negate()
    const w = n.dot(a)
    if (!planes.some((p) => p.n.dot(n) > 0.9995 && Math.abs(p.w - w) < 1e-3)) planes.push({ n, w })
  }
  return planes.map((p) => new THREE.Vector4(p.n.x, p.n.y, p.n.z, p.w))
}
function diamondMaterial(geo, env, tint, absorb) {
  const planes = facetPlanes(geo)
  const NP = Math.max(96, Math.ceil(planes.length / 16) * 16)
  while (planes.length < NP) planes.push(new THREE.Vector4(0, 0, 0, 1e6))
  return new THREE.ShaderMaterial({
    defines: { NP },
    uniforms: { uIors: { value: new THREE.Vector3(2.40, 2.42, 2.45) }, uRot: { value: new THREE.Matrix3() }, uPlanes: { value: planes }, uEnv: { value: env }, uTint: { value: new THREE.Color(tint) }, uAbsorb: { value: absorb } },
    vertexShader: `varying vec3 vPos; varying vec3 vN; varying vec3 vCam;
      void main(){ vPos = position; vN = normal; vCam = (inverse(modelMatrix) * vec4(cameraPosition,1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 uIors; uniform mat3 uRot; uniform vec4 uPlanes[NP]; uniform sampler2D uEnv; uniform vec3 uTint; uniform float uAbsorb;
      varying vec3 vPos; varying vec3 vN; varying vec3 vCam;
      vec3 envAt(vec3 dObj){ vec3 d = normalize(uRot * dObj);
        vec2 uv = vec2(atan(d.z, d.x) / 6.2831853 + 0.5, acos(clamp(d.y,-1.0,1.0)) / 3.1415926);
        return texture2D(uEnv, uv).rgb; }
      float exitPlane(vec3 p, vec3 d, out vec3 n){ float tmin = 1e9; n = vec3(0.0,1.0,0.0);
        for (int i = 0; i < NP; i++){ vec4 pl = uPlanes[i]; float dn = dot(pl.xyz, d);
          if (dn > 1e-5){ float t = (pl.w - dot(pl.xyz, p)) / dn; if (t > 1e-4 && t < tmin){ tmin = t; n = pl.xyz; } } }
        return tmin; }
      float channel(vec3 v, vec3 nrm, float ior, int c){
        vec3 d = refract(v, nrm, 1.0 / ior); vec3 p = vPos; float len = 0.0; vec3 col = vec3(0.0);
        bool done = false;
        for (int b = 0; b < 7; b++){
          vec3 n; float t = exitPlane(p, d, n); p += d * t; len += t;
          vec3 o = refract(d, -n, ior);
          if (dot(o,o) > 1e-4){ float ct = clamp(dot(o, n), 0.0, 1.0);
            col = envAt(o) * (1.0 - pow(1.0 - ct, 5.0) * 0.6); done = true; break; }
          d = reflect(d, -n);
        }
        if (!done) col = envAt(d) * 0.6;
        col *= mix(vec3(1.0), uTint, clamp(len * uAbsorb, 0.0, 1.0));
        return c == 0 ? col.r : (c == 1 ? col.g : col.b); }
      void main(){
        vec3 v = normalize(vPos - vCam); vec3 n = normalize(vN);
        if (dot(n, v) > 0.0) n = -n;
        vec3 refr = vec3(channel(v, n, uIors.x, 0), channel(v, n, uIors.y, 1), channel(v, n, uIors.z, 2));
        float f0 = pow((uIors.y - 1.0) / (uIors.y + 1.0), 2.0); float fr = f0 + (1.0 - f0) * pow(1.0 - clamp(dot(-v, n), 0.0, 1.0), 5.0);
        vec3 col = mix(refr, envAt(reflect(v, n)), fr);
        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  })
}

// ---------------------------------------------------------------- procedural lotus / clematis bloom
function veinTexture(soft = false) {
  const c = document.createElement('canvas'); c.width = c.height = 512
  const g = c.getContext('2d')
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 512, 512)
  for (let k = 0; k <= 26; k++) {
    const t = k / 26, x0 = 256 + (t - 0.5) * 40, x1 = t * 512
    g.strokeStyle = k % 3 ? `rgba(150, 95, 200, ${soft ? 0.06 : 0.16})` : `rgba(255, 255, 255, ${soft ? 0.35 : 0.55})`
    g.lineWidth = k % 3 ? 1.4 : 2.2
    g.beginPath(); g.moveTo(x0, 512); g.bezierCurveTo(x0, 330, x1 * 0.6 + x0 * 0.4, 160, x1, -10); g.stroke()
  }
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8
  return tex
}
function petalGeo(o) {
  const { length = 1, width = 0.42, cup = 0.45, curl = 0.4, ruffle = 0.025, segU = 56, segV = 28, colors, round = false, flare = 0 } = o
  const pos = [], uv = [], col = [], idx = []
  const cBase = new THREE.Color(colors[0]), cMid = new THREE.Color(colors[1]), cTip = new THREE.Color(colors[2])
  for (let i = 0; i <= segU; i++) {
    const u = i / segU
    const w = round
      ? width * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.5)), 0.38) * (1 + 0.12 * u) + 0.016
      : width * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.62)), 0.55) * (1 - 0.1 * u) + 0.014
    for (let j = 0; j <= segV; j++) {
      const v = (j / segV) * 2 - 1
      const x = v * w
      let y = u * length
      let z = cup * w * v * v + ruffle * Math.sin(u * 17 + v * 2.5) * Math.pow(Math.abs(v), 2.5)
      z -= 0.035 * width * Math.exp(-Math.pow(v * 6, 2)) * Math.sin(Math.PI * u)   // midrib groove
      const a = curl * u * u + flare * Math.pow(u, 6)   // flare: petal lip rolls outward at the rim
      const yy = y * Math.cos(a) - z * Math.sin(a), zz = y * Math.sin(a) + z * Math.cos(a)
      pos.push(x, yy, zz); uv.push(j / segV, u)
      const k = Math.pow(u, 1.1)
      const c = k < 0.45 ? cBase.clone().lerp(cMid, k / 0.45) : cMid.clone().lerp(cTip, (k - 0.45) / 0.55)
      c.lerp(new THREE.Color('#f6b9dc'), 0.18 * Math.exp(-Math.pow((u - 0.18) * 5, 2)))   // pink blush near the base
      c.multiplyScalar(1 - 0.12 * Math.pow(Math.abs(v), 2) - 0.25 * Math.exp(-u * 9))   // deeper at edges and base
      col.push(c.r, c.g, c.b)
    }
  }
  for (let i = 0; i < segU; i++) for (let j = 0; j < segV; j++) {
    const a = i * (segV + 1) + j, b = a + segV + 1
    idx.push(a, b, a + 1, b, b + 1, a + 1)
  }
  const g = new THREE.BufferGeometry()
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3))
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2))
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3))
  g.setIndex(idx); g.computeVertexNormals()
  return g
}
function placePetal(mesh, azimuth, elevation) {
  const ca = Math.cos(azimuth), sa = Math.sin(azimuth), ce = Math.cos(elevation), se = Math.sin(elevation)
  const yAx = new THREE.Vector3(ce * ca, se, ce * sa)
  const zAx = new THREE.Vector3(-se * ca, ce, -se * sa)
  const xAx = new THREE.Vector3().crossVectors(yAx, zAx)
  mesh.matrix.makeBasis(xAx, yAx, zAx); mesh.matrixAutoUpdate = false
}
// Inner glow along the petal (uv.y = 0 at the base): stands in for light passing through thin petals.
function glowTexture(base, tip) {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 256, 0, 0)
  gr.addColorStop(0, base); gr.addColorStop(0.45, tip); gr.addColorStop(1, '#000000')
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256)
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t
}
function bloom(o = {}) {
  const group = new THREE.Group()
  const film = !!o.film
  const vein = veinTexture(film)
  const palette = o.palette ?? ['#fdf4ff', '#c493ee', '#6b2fb8']
  const mat = new THREE.MeshPhysicalMaterial({
    vertexColors: true, map: vein, bumpMap: vein, bumpScale: film ? 0.15 : 0.6, roughness: film ? 0.34 : 0.42, metalness: 0,
    sheen: film ? 1 : 0.7, sheenColor: new THREE.Color(o.sheen ?? '#ffe8fb'), sheenRoughness: film ? 0.32 : 0.45,
    clearcoat: film ? 0.45 : 0.25, clearcoatRoughness: film ? 0.32 : 0.55,
    specularIntensity: 0.55, side: THREE.DoubleSide, emissive: new THREE.Color(film ? '#ffffff' : (o.glow ?? '#5a2896')),
    emissiveIntensity: o.glowIntensity ?? (film ? 0.5 : 0.16), emissiveMap: film ? glowTexture(o.glowBase ?? '#ffd9f4', o.glowTip ?? '#5b2a9a') : null })
  const spiral = o.style === 'rose'
  const rings = spiral ? [] : o.bud
    ? [{ n: 5, len: 0.78, wid: 0.36, elev: 1.38, curl: 0.9, cup: 0.6, jitter: 0.05, base: 0.05, y: 0 }]
    : [
        { n: 9, len: 1.0, wid: 0.5, elev: 0.1, curl: -0.28, cup: 0.36, jitter: 0.08, base: 0.2, y: 0.0 },
        { n: 8, len: 0.92, wid: 0.48, elev: 0.5, curl: 0.0, cup: 0.42, jitter: 0.08, base: 0.16, y: 0.05 },
        { n: 7, len: 0.76, wid: 0.44, elev: 0.88, curl: 0.12, cup: 0.46, jitter: 0.06, base: 0.12, y: 0.1 },
        { n: 6, len: 0.52, wid: 0.38, elev: 1.12, curl: 0.12, cup: 0.4, jitter: 0.05, base: 0.09, y: 0.15 }
      ]

  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647
  if (spiral) {
    const N = 34, lerp = (a, b, t) => a + (b - a) * t
    for (let i = 0; i < N; i++) {
      const t = i / (N - 1)
      const g = petalGeo({ length: lerp(0.36, 0.86, Math.pow(t, 0.6)), width: lerp(0.3, 0.54, t), cup: lerp(0.9, 0.62, t),
        curl: lerp(1.55, 0.25, Math.pow(t, 0.7)) + (rnd() - 0.5) * 0.1, colors: palette, round: true,
        flare: lerp(0, -0.5, t), ruffle: 0.03 })
      const m = new THREE.Mesh(g, mat)
      const az = i * 2.39996 + (rnd() - 0.5) * 0.1
      placePetal(m, az, lerp(1.42, 0.42, Math.pow(t, 0.8)) + (rnd() - 0.5) * 0.06)
      m.updateMatrix = () => {}
      const b = lerp(0.02, 0.17, t)
      m.matrix.setPosition(Math.cos(az) * b, lerp(0.22, 0.0, t), Math.sin(az) * b)
      m.castShadow = true; m.receiveShadow = true
      group.add(m)
    }
  }
  rings.forEach((r, ri) => {
    for (let i = 0; i < r.n; i++) {
      const g = petalGeo({ length: r.len * (1 + (rnd() - 0.5) * 0.12), width: r.wid, cup: r.cup, curl: r.curl + (rnd() - 0.5) * 0.2, colors: palette,
        round: o.style === 'rose', flare: r.flare ?? 0, ruffle: o.style === 'rose' ? 0.04 : 0.025 })
      const m = new THREE.Mesh(g, mat)
      const az = (i / r.n) * Math.PI * 2 + ri * 0.45 + (rnd() - 0.5) * r.jitter
      placePetal(m, az, r.elev + (rnd() - 0.5) * r.jitter)
      m.updateMatrix = () => {}
      m.matrix.setPosition(Math.cos(az) * r.base, r.y, Math.sin(az) * r.base)
      m.castShadow = true; m.receiveShadow = true
      group.add(m)
    }
  })
  if (!o.bud && o.style !== 'rose') {
    const sMat = new THREE.MeshStandardMaterial({ color: '#f4e7c2', roughness: 0.5 })
    const aMat = new THREE.MeshPhysicalMaterial({ color: '#f0b93e', roughness: 0.3, sheen: 0.8, sheenColor: new THREE.Color('#fff2c4'), emissive: new THREE.Color('#7a4a00'), emissiveIntensity: 0.15 })
    for (let i = 0; i < 46; i++) {
      const a = rnd() * Math.PI * 2, r = 0.05 + rnd() * 0.12, h = 0.22 + rnd() * 0.16
      const end = new THREE.Vector3(Math.cos(a) * (r + 0.08), h, Math.sin(a) * (r + 0.08))
      const curve = new THREE.QuadraticBezierCurve3(new THREE.Vector3(Math.cos(a) * r * 0.4, 0.02, Math.sin(a) * r * 0.4), new THREE.Vector3(Math.cos(a) * r, h * 0.6, Math.sin(a) * r), end)
      group.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 12, 0.005, 6), sMat))
      const anther = new THREE.Mesh(new THREE.SphereGeometry(0.026, 14, 12), aMat)
      anther.position.copy(end); anther.scale.set(1, 1.6, 1); group.add(anther)
    }

function shapeGeo(kind) {

// Lily pad: a round leaf with a notch, rim lifted slightly, radial ribs; glossy like an animated-film prop.

    const drop = new THREE.Mesh(new THREE.SphereGeometry(d[2], 32, 24), new THREE.MeshPhysicalMaterial({ color: '#ffffff', roughness: 0.02, transmission: 1, ior: 1.33, thickness: d[2] * 1.6, clearcoat: 1 }))

function crystalGeo(r = 0.18, h = 1, tip = 0.32) {

window.kitDeps = { petalGeo, placePetal, heartGeo }
window.renderJob = async (job) => {

  scene.environmentRotation = new THREE.Euler(0, job.envRotation ?? 0, 0)

  let object = (await buildKind(job)) ?? buildKind2(job) ?? buildKind3(job)
  if (object) {
    // built by kit.js
  } else if (job.kind === 'bloom') {
    object = new THREE.Group()
    for (const f of job.flowers) {
      const b = bloom({ bud: f.bud, seed: f.seed, palette: f.palette, style: f.style, glow: f.glow, glowIntensity: f.glowIntensity, sheen: f.sheen, film: f.film, glowBase: f.glowBase, glowTip: f.glowTip })
      b.position.fromArray(f.pos); b.rotation.fromArray(f.rot); b.scale.setScalar(f.scale ?? 1)
      object.add(b)
    }
    for (const p of job.pads ?? []) {
      const pad = lilyPad(p)
      pad.position.fromArray(p.pos); pad.rotation.fromArray(p.rot ?? [0, 0, 0]); pad.scale.setScalar(p.scale ?? 1)
      object.add(pad)
    }

      const m = new THREE.Mesh(geo, diamondMaterial(geo, hdr, c.tint ?? '#b48be6', c.absorb ?? 0.9))
      m.onBeforeRender = () => m.material.uniforms.uRot.value.setFromMatrix4(m.matrixWorld)
      m.material.uniforms.uIors = { value: new THREE.Vector3(1.54, 1.55, 1.56) }
      m.position.fromArray(c.pos); m.rotation.fromArray(c.rot); m.scale.setScalar(c.scale ?? 1)
      object.add(m)
    }
  } else if (job.kind === 'heart' || job.kind === 'star') {
    object = new THREE.Group()
    const geo = job.kind === 'heart' ? heartGeo() : starGeo()
    const mat = job.kind === 'heart'
      ? new THREE.MeshPhysicalMaterial({ color: job.color ?? '#f3a6c8', roughness: 0.16, clearcoat: 1, clearcoatRoughness: 0.04, sheen: 0.5, sheenColor: new THREE.Color('#ffe3f1'), iridescence: 0.25, iridescenceIOR: 1.35, envMapIntensity: 1.2 })
      : new THREE.MeshPhysicalMaterial({ color: job.color ?? '#e9c48e', metalness: 1, roughness: 0.17, clearcoat: 0.6, clearcoatRoughness: 0.08, envMapIntensity: 1.4 })

    object = new THREE.Group()
    const geo = gemGeo(job.cut)
    const m = new THREE.Mesh(geo, diamondMaterial(geo, job.studio ? studioRing(job.studio) : hdr, job.tint ?? '#ffffff', job.absorb ?? 0))

      m.onBeforeRender = () => m.material.uniforms.uRot.value.setFromMatrix4(m.matrixWorld)
      m.position.fromArray(d.pos); m.rotation.fromArray(d.rot); m.scale.setScalar(d.scale ?? 1)

    }

    object = gltf.scene

  const dist = (radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2))) * (job.zoom ?? 1)
