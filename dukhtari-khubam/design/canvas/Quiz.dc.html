<!doctype html>
<html lang="tg">
<head>
<meta charset="utf-8">
<title>Тест</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Lora:ital,wght@0,500;0,600;0,700;1,500&amp;display=swap">
<style>
body{margin:0}
.dk{--bg:#FBF9FD;--surface:#FFFFFF;--lav:#EEE7F6;--lilac:#DCCCEB;--primary:#A78BCB;--plum:#59446E;--rose:#EBDCE4;--champ:#E8D7B9;--sage:#DDE9DF;--ink:#2E2338;--muted:#6B5A7B;--accent-ink:#6B4F8F;--glass:rgba(255,255,255,.55);--glass-strong:rgba(255,255,255,.8);--edge:rgba(255,255,255,.92);--edge-low:rgba(167,139,203,.24);--shadow:rgba(89,68,110,.18);--btn-top:#7C61A3;--btn-bot:#59446E;--on-btn:#FFFFFF;--bloom1:rgba(220,204,235,.9);--bloom2:rgba(235,220,228,.85);--ok-bg:#E6F2EA;--ok-bd:#7FB08F;--ok-ink:#24573A;--bad-bg:#F8E5EA;--bad-bd:#D48A9C;--bad-ink:#8A2E45;font-family:'Onest',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.dk.dark{--bg:#17131E;--surface:#211B2A;--lav:#30263B;--lilac:#4A3C5A;--primary:#B7A0D3;--plum:#D8C8EA;--rose:#3A2B36;--champ:#CBB58F;--sage:#2F3F35;--ink:#F4EFF8;--muted:#BDB1CB;--accent-ink:#D8C8EA;--glass:rgba(48,38,59,.5);--glass-strong:rgba(48,38,59,.82);--edge:rgba(216,200,234,.26);--edge-low:rgba(0,0,0,.35);--shadow:rgba(0,0,0,.5);--btn-top:#CDBBE3;--btn-bot:#B7A0D3;--on-btn:#17131E;--bloom1:rgba(120,92,158,.38);--bloom2:rgba(183,143,164,.22);--ok-bg:#22362A;--ok-bd:#4E7D5E;--ok-ink:#BFE3CB;--bad-bg:#3A2028;--bad-bd:#A35A6C;--bad-ink:#F2C4CF}
.serif{font-family:'Lora',Georgia,serif}
.glass{background:linear-gradient(140deg,var(--glass-strong),var(--glass));border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--edge),inset 0 -1px 0 var(--edge-low),0 14px 34px -12px var(--shadow);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.ico{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--plum);text-decoration:none;flex:none}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:12px 16px;border-radius:20px;border:1.5px solid var(--lilac);background:var(--surface);color:var(--ink);font-family:inherit;font-size:16px;font-weight:500;text-align:left;cursor:pointer;box-sizing:border-box;box-shadow:0 6px 16px -12px var(--shadow);transition:border-color .2s,background .2s}
.opt.sel{border-color:var(--plum);background:var(--lav)}
.opt.ok{border-color:var(--ok-bd);background:var(--ok-bg);color:var(--ok-ink)}
.opt.bad{border-color:var(--bad-bd);background:var(--bad-bg);color:var(--bad-ink)}
.mark{width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:28px;border:0;background:linear-gradient(180deg,var(--btn-top),var(--btn-bot));color:var(--on-btn);font-family:inherit;font-weight:600;font-size:16px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 6px rgba(0,0,0,.14),0 14px 26px -12px var(--shadow)}
.btn:disabled{opacity:.45;cursor:not-allowed}
a:focus-visible,button:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
</style>
</helmet>
<div class="{{rootClass}}" style="width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box">
<div aria-hidden="true" style="position:absolute;inset:0;background:radial-gradient(50% 24% at 100% 0%,var(--bloom1),transparent 70%),radial-gradient(60% 24% at 0% 100%,var(--bloom2),transparent 70%)"></div>
<div aria-hidden="true" style="position:absolute;left:-20px;bottom:-14px;pointer-events:none"><dc-import name="Art" kind="crystal" size="110" hint-size="110px,110px"></dc-import></div>
<div aria-hidden="true" style="position:absolute;right:-26px;bottom:-24px;pointer-events:none"><dc-import name="Art" kind="lotus" size="130" hint-size="130px,130px"></dc-import></div>

<header style="position:absolute;left:16px;right:24px;top:48px;display:flex;align-items:center;gap:14px">
<a href="Lesson.dc.html" class="glass ico" aria-label="Пӯшидан">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<div style="flex:1;display:flex;flex-direction:column;gap:6px">
<span style="font-size:13px;font-weight:600;color:var(--muted)">Саволи [n] аз [N]</span>
<div role="progressbar" aria-label="Пешрафти тест" aria-valuemin="0" aria-valuemax="100" aria-valuenow="30" style="height:6px;border-radius:3px;background:var(--lilac);overflow:hidden"><div style="width:30%;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--primary),var(--plum))"></div></div>
</div>
</header>

<h1 id="q" style="position:absolute;left:24px;right:24px;top:132px;margin:0;font-size:22px;line-height:1.35;font-weight:600;color:var(--ink)">[Матни савол — аз Quiz Builder]</h1>

<div role="radiogroup" aria-labelledby="q" style="position:absolute;left:20px;right:20px;top:216px;display:flex;flex-direction:column;gap:12px">
<sc-for list="{{options}}" as="o" hint-placeholder-count="4">
<button type="button" role="radio" class="{{o.cls}}" aria-checked="{{o.checked}}" onClick="{{o.pick}}">
<span class="mark" aria-hidden="true">
<sc-if value="{{o.ring}}" hint-placeholder-val="{{true}}"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="var(--primary)" stroke-width="1.8"></circle></svg></sc-if>
<sc-if value="{{o.dot}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="var(--plum)" stroke-width="1.8"></circle><circle cx="12" cy="12" r="5" fill="var(--plum)"></circle></svg></sc-if>
<sc-if value="{{o.check}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--ok-bd)"></circle><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
<sc-if value="{{o.cross}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--bad-bd)"></circle><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path></svg></sc-if>
</span>
<span>{{o.text}}</span>
</button>
</sc-for>
</div>

<sc-if value="{{submitted}}" hint-placeholder-val="{{false}}">
<div role="status" style="position:absolute;left:20px;right:20px;top:530px;padding:16px 18px;border-radius:20px;background:var(--surface);border:1px solid var(--lilac);box-shadow:0 10px 24px -14px var(--shadow);display:flex;flex-direction:column;gap:6px">
<b style="font-size:16px;color:{{verdictColor}}">{{verdict}}</b>
<span style="font-size:14px;line-height:1.5;color:var(--muted)">Шарҳ: [Шарҳи муаллиф]</span>
</div>
</sc-if>

<div style="position:absolute;left:24px;right:24px;top:680px">
<sc-if value="{{notSubmitted}}" hint-placeholder-val="{{true}}">
<button type="button" class="btn" disabled="{{noPick}}" onClick="{{submit}}">Санҷиш</button>
</sc-if>
<sc-if value="{{submitted}}" hint-placeholder-val="{{false}}">
<button type="button" class="btn" onClick="{{reset}}">Идома
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></button>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: null, submitted: false };
  }
  renderVals() {
    const dark = !!this.props.dark;
    // Demo only: in production the answer key stays on the backend until submit (QZ-16).
    const correct = 1;
    const { pick, submitted } = this.state;
    const texts = ['[Варианти А]', '[Варианти Б]', '[Варианти В]', '[Варианти Г]'];
    const options = texts.map((text, i) => {
      const sel = pick === i;
      const isOk = submitted && i === correct;
      const isBad = submitted && sel && i !== correct;
      let cls = 'opt';
      if (isOk) cls += ' ok';
      else if (isBad) cls += ' bad';
      else if (sel) cls += ' sel';
      return {
        text,
        cls,
        checked: sel ? 'true' : 'false',
        ring: !sel && !isOk,
        dot: sel && !submitted,
        check: isOk,
        cross: isBad,
        pick: () => { if (!this.state.submitted) this.setState({ pick: i }); }
      };
    });
    const right = pick === correct;
    return {
      rootClass: dark ? 'dk dark' : 'dk',
      options,
      submitted,
      notSubmitted: !submitted,
      noPick: pick === null,
      verdict: right ? 'Дуруст' : 'Нодуруст',
      verdictColor: right ? 'var(--ok-ink)' : 'var(--bad-ink)',
      submit: () => this.setState({ submitted: true }),
      reset: () => this.setState({ pick: null, submitted: false })
    };
  }
}
</script>
</body>
</html>
