<!doctype html>
<html lang="tg">
<head>
<meta charset="utf-8">
<title>Маърифати динӣ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Lora:ital,wght@0,500;0,600;0,700;1,500&amp;display=swap">
<style>
body{margin:0}
.dk{--bg:#FBF9FD;--surface:#FFFFFF;--lav:#EEE7F6;--lilac:#DCCCEB;--primary:#A78BCB;--plum:#59446E;--rose:#EBDCE4;--champ:#E8D7B9;--sage:#DDE9DF;--ink:#2E2338;--muted:#6B5A7B;--accent-ink:#6B4F8F;--glass:rgba(255,255,255,.55);--glass-strong:rgba(255,255,255,.8);--edge:rgba(255,255,255,.92);--edge-low:rgba(167,139,203,.24);--shadow:rgba(89,68,110,.18);--btn-top:#7C61A3;--btn-bot:#59446E;--on-btn:#FFFFFF;--bloom1:rgba(220,204,235,.9);--bloom2:rgba(235,220,228,.85);--bloom3:rgba(232,215,185,.5);--ok:#3F7A57;font-family:'Onest',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.dk.dark{--bg:#17131E;--surface:#211B2A;--lav:#30263B;--lilac:#4A3C5A;--primary:#B7A0D3;--plum:#D8C8EA;--rose:#3A2B36;--champ:#CBB58F;--sage:#2F3F35;--ink:#F4EFF8;--muted:#BDB1CB;--accent-ink:#D8C8EA;--glass:rgba(48,38,59,.5);--glass-strong:rgba(48,38,59,.82);--edge:rgba(216,200,234,.26);--edge-low:rgba(0,0,0,.35);--shadow:rgba(0,0,0,.5);--btn-top:#CDBBE3;--btn-bot:#B7A0D3;--on-btn:#17131E;--bloom1:rgba(120,92,158,.38);--bloom2:rgba(183,143,164,.22);--bloom3:rgba(203,181,143,.14);--ok:#8FCBA6}
.serif{font-family:'Lora',Georgia,serif}
.glass{background:linear-gradient(140deg,var(--glass-strong),var(--glass));border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--edge),inset 0 -1px 0 var(--edge-low),0 14px 34px -12px var(--shadow);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.ico{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--plum);text-decoration:none;flex:none}
.bar{height:6px;border-radius:3px;background:var(--lilac);overflow:hidden}
.bar span{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--primary),var(--plum))}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:22px;background:var(--lav)}
.tab{height:36px;border:0;border-radius:18px;background:transparent;color:var(--muted);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:background .25s,color .25s}
.tab.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 4px 12px -6px var(--shadow),inset 0 1px 0 var(--edge)}
.row{display:flex;align-items:center;gap:12px;min-height:72px;padding:10px 12px;border-radius:20px;text-decoration:none;color:var(--ink);box-sizing:border-box}
.thumb{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.row b{display:block;font-size:15px;font-weight:600;line-height:20px}
.row small{display:block;font-size:12px;color:var(--muted);line-height:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:27px;background:linear-gradient(180deg,var(--btn-top),var(--btn-bot));color:var(--on-btn);font-weight:600;font-size:16px;text-decoration:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 6px rgba(0,0,0,.14),0 14px 26px -12px var(--shadow)}
.meta{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--lilac);font-size:14px}
.meta span:first-child{color:var(--muted)}
a:focus-visible,button:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
</style>
</helmet>
<div class="{{rootClass}}" style="width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box">
<div aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(180deg,var(--lav),var(--rose))">
<div style="position:absolute;left:50%;top:10px;width:300px;height:300px;margin-left:-150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.75),rgba(255,255,255,0) 65%)"></div>
</div>
<div style="position:absolute;left:50%;top:56px;margin-left:-95px;pointer-events:none">
<dc-import name="Art" kind="religion" size="190" hint-size="190px,190px"></dc-import>
</div>
<div style="position:absolute;right:30px;top:70px;pointer-events:none">
<dc-import name="Art" kind="crystal" size="64" hint-size="64px,64px"></dc-import>
</div>
<a href="Schools.dc.html" class="glass ico" aria-label="Бозгашт" style="position:absolute;left:16px;top:48px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>

<section class="glass" style="position:absolute;left:0;right:0;top:252px;bottom:0;border-radius:32px 32px 0 0;padding:24px 20px 0;box-sizing:border-box;background:linear-gradient(180deg,var(--glass-strong),var(--bg) 40%)">
<h1 class="serif" style="margin:0;font-size:28px;line-height:1.2;font-weight:600;color:var(--plum)">Маърифати динӣ</h1>
<p style="margin:6px 0 0;font-size:14px;color:var(--muted)">[Тавсифи кӯтоҳ аз CMS]</p>
<div style="display:flex;align-items:center;gap:12px;margin-top:16px">
<div class="bar" style="flex:1" role="progressbar" aria-label="Пешрафти мактаб" aria-valuemin="0" aria-valuemax="100" aria-valuenow="60"><span style="width:60%"></span></div>
<span style="font-size:13px;font-weight:600;color:var(--accent-ink);min-width:44px;text-align:right">[N]%</span>
</div>
<div class="seg" role="tablist" aria-label="Бахшҳо" style="margin-top:18px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" class="{{t.cls}}" aria-selected="{{t.sel}}" onClick="{{t.pick}}">{{t.label}}</button>
</sc-for>
</div>

<sc-if value="{{show.courses}}" hint-placeholder-val="{{true}}">
<div role="tabpanel" style="display:flex;flex-direction:column;gap:8px;margin-top:14px">
<a href="Lesson.dc.html" class="glass row">
<div class="thumb" style="background:var(--champ)"><dc-import name="Art" kind="religion" size="44" hint-size="44px,44px"></dc-import></div>
<div style="flex:1;min-width:0"><b>[Номи курс]</b><small>[N] модул · [N] соат</small></div>
<svg width="24" height="24" viewBox="0 0 24 24" aria-label="Анҷом ёфт" role="img"><circle cx="12" cy="12" r="10" fill="var(--ok)"></circle><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</a>
<a href="Lesson.dc.html" class="glass row">
<div class="thumb" style="background:var(--lav)"><dc-import name="Art" kind="lotus" size="46" hint-size="46px,46px"></dc-import></div>
<div style="flex:1;min-width:0"><b>[Номи курс]</b><small>Дарси [N] аз [N]</small></div>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--plum)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
<a href="Lesson.dc.html" class="glass row">
<div class="thumb" style="background:var(--rose)"><dc-import name="Art" kind="crystal" size="44" hint-size="44px,44px"></dc-import></div>
<div style="flex:1;min-width:0"><b>[Номи курс]</b><small>Premium · [N] модул</small></div>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Premium"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
</a>
</div>
</sc-if>

<sc-if value="{{show.about}}" hint-placeholder-val="{{false}}">
<div role="tabpanel" style="margin-top:16px">
<p style="margin:0 0 8px;font-size:15px;line-height:1.6;color:var(--ink)">[Тавсифи пурраи мактаб — аз CMS]</p>
<div class="meta"><span>Сатҳ</span><span>[Сатҳ]</span></div>
<div class="meta"><span>Давомнокӣ</span><span>[N] соат</span></div>
<div class="meta"><span>Забон</span><span>Тоҷикӣ</span></div>
</div>
</sc-if>

<sc-if value="{{show.results}}" hint-placeholder-val="{{false}}">
<div role="tabpanel" style="margin-top:36px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">
<dc-import name="Art" kind="trophy" size="88" hint-size="88px,88px"></dc-import>
<b style="font-size:16px;font-weight:600">Ҳанӯз натиҷа нест</b>
<span style="font-size:14px;color:var(--muted)">Пас аз тест пайдо мешавад.</span>
</div>
</sc-if>
</section>

<a href="Lesson.dc.html" class="btn" style="position:absolute;left:24px;right:24px;top:666px">Идома
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></a>

<div style="position:absolute;left:0;right:0;bottom:0">
<dc-import name="BottomNav" active="schools" dark="{{dark}}" embedded="1" hint-size="390px,120px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'courses' };
  }
  renderVals() {
    const dark = !!this.props.dark;
    const list = [
      { id: 'courses', label: 'Курсҳо' },
      { id: 'about', label: 'Тавсиф' },
      { id: 'results', label: 'Натиҷаҳо' }
    ];
    const tabs = list.map((t) => {
      const on = this.state.tab === t.id;
      return { ...t, cls: on ? 'tab on' : 'tab', sel: on ? 'true' : 'false', pick: () => this.setState({ tab: t.id }) };
    });
    const show = { courses: this.state.tab === 'courses', about: this.state.tab === 'about', results: this.state.tab === 'results' };
    return { rootClass: dark ? 'dk dark' : 'dk', dark, tabs, show };
  }
}
</script>
</body>
</html>
