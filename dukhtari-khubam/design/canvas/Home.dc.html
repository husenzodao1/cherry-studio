<!doctype html>
<html lang="tg">
<head>
<meta charset="utf-8">
<title>Асосӣ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Lora:ital,wght@0,500;0,600;0,700;1,500&amp;display=swap">
<style>
body{margin:0}
.dk{--bg:#FBF9FD;--surface:#FFFFFF;--lav:#EEE7F6;--lilac:#DCCCEB;--primary:#A78BCB;--plum:#59446E;--rose:#EBDCE4;--champ:#E8D7B9;--sage:#DDE9DF;--ink:#2E2338;--muted:#6B5A7B;--accent-ink:#6B4F8F;--glass:rgba(255,255,255,.55);--glass-strong:rgba(255,255,255,.8);--edge:rgba(255,255,255,.92);--edge-low:rgba(167,139,203,.24);--shadow:rgba(89,68,110,.18);--btn-top:#7C61A3;--btn-bot:#59446E;--on-btn:#FFFFFF;--bloom1:rgba(220,204,235,.9);--bloom2:rgba(235,220,228,.85);--bloom3:rgba(232,215,185,.5);font-family:'Onest',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.dk.dark{--bg:#17131E;--surface:#211B2A;--lav:#30263B;--lilac:#4A3C5A;--primary:#B7A0D3;--plum:#D8C8EA;--rose:#3A2B36;--champ:#CBB58F;--sage:#2F3F35;--ink:#F4EFF8;--muted:#BDB1CB;--accent-ink:#D8C8EA;--glass:rgba(48,38,59,.5);--glass-strong:rgba(48,38,59,.82);--edge:rgba(216,200,234,.26);--edge-low:rgba(0,0,0,.35);--shadow:rgba(0,0,0,.5);--btn-top:#CDBBE3;--btn-bot:#B7A0D3;--on-btn:#17131E;--bloom1:rgba(120,92,158,.38);--bloom2:rgba(183,143,164,.22);--bloom3:rgba(203,181,143,.14)}
.serif{font-family:'Lora',Georgia,serif}
.glass{background:linear-gradient(140deg,var(--glass-strong),var(--glass));border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--edge),inset 0 -1px 0 var(--edge-low),0 14px 34px -12px var(--shadow);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.help{width:22px;height:22px;border-radius:50%;border:1px solid var(--lilac);background:var(--glass-strong);color:var(--accent-ink);font-family:inherit;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.bar{height:6px;border-radius:3px;background:var(--lilac);overflow:hidden}
.bar span{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--primary),var(--plum))}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:16px;background:linear-gradient(180deg,var(--btn-top),var(--btn-bot));color:var(--on-btn);font-size:13px;font-weight:600;text-decoration:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 16px -10px var(--shadow)}
.play{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--on-btn);background:radial-gradient(120% 120% at 30% 25%,var(--btn-top),var(--btn-bot));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 16px -8px var(--shadow);text-decoration:none;flex:none}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:104px;height:124px;flex:none;border-radius:22px;text-decoration:none;color:var(--ink);text-align:center;font-size:12px;font-weight:600;line-height:15px;padding:8px;box-sizing:border-box}
.link{font-size:13px;font-weight:600;color:var(--accent-ink);text-decoration:none;display:inline-flex;align-items:center;gap:4px;min-height:32px}
a:focus-visible,button:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
</style>
</helmet>
<div class="{{rootClass}}" style="width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box">
<div aria-hidden="true" style="position:absolute;inset:0;background:radial-gradient(55% 30% at 100% 14%,var(--bloom1),transparent 70%),radial-gradient(50% 30% at 0% 50%,var(--bloom2),transparent 70%),radial-gradient(60% 26% at 90% 96%,var(--bloom3),transparent 70%)"></div>

<header style="position:absolute;left:24px;right:24px;top:52px;display:flex;align-items:center;justify-content:space-between;gap:12px">
<div style="display:flex;flex-direction:column;gap:2px">
<p style="margin:0;font-size:15px;color:var(--muted)">Салом, [Ном]</p>
<h1 class="serif" style="margin:0;font-size:28px;line-height:1.15;font-weight:600;color:var(--plum)">Духтари хубам</h1>
</div>
<a href="Profile.dc.html" class="glass" aria-label="Профил" style="width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--plum);flex:none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
</a>
</header>

<section class="glass" aria-label="Илҳоми рӯз" style="position:absolute;left:20px;right:20px;top:134px;height:156px;border-radius:28px;padding:20px 22px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;gap:8px">
<span style="font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)">Илҳоми рӯз</span>
<button type="button" class="help" aria-label="Шарҳ: Илҳоми рӯз">!</button>
</div>
<p class="serif" style="margin:0;max-width:200px;font-size:19px;line-height:1.35;font-style:italic;font-weight:500;color:var(--plum)">“[Иқтибос аз CMS]”</p>
<div style="display:flex;align-items:center;gap:12px;margin-top:auto">
<a href="Lesson.dc.html" class="pill">Бештар
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></a>
<span style="font-size:12px;color:var(--muted)">— [Манбаъ]</span>
</div>
</section>
<div style="position:absolute;right:6px;top:96px;pointer-events:none">
<dc-import name="Art" kind="lotus" size="150" hint-size="150px,150px"></dc-import>
</div>
<div style="position:absolute;right:112px;top:94px;pointer-events:none">
<dc-import name="Art" kind="crystal" size="58" hint-size="58px,58px"></dc-import>
</div>

<h2 style="position:absolute;left:24px;top:312px;margin:0;font-size:20px;line-height:28px;font-weight:600;color:var(--ink)">Идомаи омӯзиш</h2>
<div class="glass" style="position:absolute;left:20px;right:20px;top:350px;height:88px;border-radius:24px;padding:12px 14px;box-sizing:border-box;display:flex;align-items:center;gap:12px">
<div style="width:60px;height:60px;border-radius:18px;background:var(--lav);display:flex;align-items:center;justify-content:center;flex:none">
<dc-import name="Art" kind="religion" size="52" hint-size="52px,52px"></dc-import>
</div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">
<span style="font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">[Номи курс]</span>
<span style="font-size:12px;color:var(--muted)">Дарси [N] аз [N]</span>
<div class="bar" role="progressbar" aria-label="Пешрафти курс" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40"><span style="width:40%"></span></div>
</div>
<a href="Lesson.dc.html" class="play" aria-label="Идома">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"></path></svg>
</a>
</div>

<div style="position:absolute;left:24px;right:20px;top:462px;display:flex;align-items:center;justify-content:space-between">
<h2 style="margin:0;font-size:20px;line-height:28px;font-weight:600;color:var(--ink)">Ҳафт мактаби дониш</h2>
<a href="Schools.dc.html" class="link">Ҳама
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></a>
</div>
<div style="position:absolute;left:20px;right:0;top:502px;display:flex;gap:10px;overflow:hidden">
<a href="School.dc.html" class="glass tile"><dc-import name="Art" kind="religion" size="56" hint-size="56px,56px"></dc-import><span>Маърифати динӣ</span></a>
<a href="School.dc.html" class="glass tile"><dc-import name="Art" kind="ethics" size="56" hint-size="56px,56px"></dc-import><span>Одоб ва ахлоқ</span></a>
<a href="School.dc.html" class="glass tile"><dc-import name="Art" kind="culture" size="56" hint-size="56px,56px"></dc-import><span>Фарҳанги тоҷик</span></a>
<a href="School.dc.html" class="glass tile"><dc-import name="Art" kind="family" size="56" hint-size="56px,56px"></dc-import><span>Оила ва муносибатҳо</span></a>
</div>

<h2 style="position:absolute;left:24px;top:650px;margin:0;font-size:20px;line-height:28px;font-weight:600;color:var(--ink)">Тавсия</h2>
<div class="glass" style="position:absolute;left:20px;right:20px;top:688px;height:120px;border-radius:24px;padding:16px;box-sizing:border-box;display:flex;gap:14px;align-items:flex-start">
<div style="width:72px;height:72px;border-radius:20px;background:var(--sage);display:flex;align-items:center;justify-content:center;flex:none">
<dc-import name="Art" kind="health" size="60" hint-size="60px,60px"></dc-import>
</div>
<div style="display:flex;flex-direction:column;gap:4px;min-width:0">
<span style="font-size:12px;font-weight:600;color:var(--accent-ink)">Илм ва саломатӣ</span>
<span style="font-size:15px;font-weight:600;color:var(--ink)">[Номи курс]</span>
<span style="font-size:12px;color:var(--muted)">[N] модул · [N] соат</span>
</div>
</div>

<div style="position:absolute;left:0;right:0;bottom:0">
<dc-import name="BottomNav" active="home" dark="{{dark}}" embedded="1" hint-size="390px,120px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    return { rootClass: dark ? 'dk dark' : 'dk', dark };
  }
}
</script>
</body>
</html>
