<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["religion","ethics","culture","family","health","growth","modern","lotus","crystal","trophy"],"default":"religion"},"size":{"editor":"int","default":160,"min":24,"max":400,"unit":"px"},"$preview":{"width":160,"height":160}}'>
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind || 'religion';
    const size = Number(this.props.size) || 160;
    const kinds = ['religion', 'ethics', 'culture', 'family', 'health', 'growth', 'modern', 'lotus', 'crystal', 'trophy'];
    const is = {};
    kinds.forEach((k) => { is[k] = k === kind; });
    return { px: size + 'px', is };
  }
}
</script>
