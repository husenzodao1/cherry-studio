<!doctype html>
<html lang="tg">
<head>
<meta charset="utf-8">
<title>Духтари хубам — Welcome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Lora:ital,wght@0,500;0,600;0,700;1,500&amp;family=Noto+Naskh+Arabic:wght@500;600&amp;display=swap">
<style>
body{margin:0}
.dk{--bg:#FBF9FD;--surface:#FFFFFF;--lav:#EEE7F6;--lilac:#DCCCEB;--primary:#A78BCB;--plum:#59446E;--rose:#EBDCE4;--champ:#E8D7B9;--sage:#DDE9DF;--ink:#2E2338;--muted:#6B5A7B;--accent-ink:#6B4F8F;--glass:rgba(255,255,255,.55);--glass-strong:rgba(255,255,255,.8);--edge:rgba(255,255,255,.92);--edge-low:rgba(167,139,203,.24);--shadow:rgba(89,68,110,.18);--btn-top:#7C61A3;--btn-bot:#59446E;--on-btn:#FFFFFF;--bloom1:rgba(220,204,235,.9);--bloom2:rgba(235,220,228,.85);--bloom3:rgba(232,215,185,.5);font-family:'Onest',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.dk.dark{--bg:#17131E;--surface:#211B2A;--lav:#30263B;--lilac:#4A3C5A;--primary:#B7A0D3;--plum:#D8C8EA;--rose:#3A2B36;--champ:#CBB58F;--sage:#2F3F35;--ink:#F4EFF8;--muted:#BDB1CB;--accent-ink:#D8C8EA;--glass:rgba(48,38,59,.5);--glass-strong:rgba(48,38,59,.82);--edge:rgba(216,200,234,.26);--edge-low:rgba(0,0,0,.35);--shadow:rgba(0,0,0,.5);--btn-top:#CDBBE3;--btn-bot:#B7A0D3;--on-btn:#17131E;--bloom1:rgba(120,92,158,.38);--bloom2:rgba(183,143,164,.22);--bloom3:rgba(203,181,143,.14)}
.serif{font-family:'Lora',Georgia,serif}
.glass{background:linear-gradient(140deg,var(--glass-strong),var(--glass));border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--edge),inset 0 -1px 0 var(--edge-low),0 14px 34px -10px var(--shadow);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border-radius:28px;background:linear-gradient(180deg,var(--btn-top),var(--btn-bot));color:var(--on-btn);font-weight:600;font-size:16px;text-decoration:none;border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 6px rgba(0,0,0,.14),0 14px 26px -12px var(--shadow);cursor:pointer;transition:transform .2s}
.btn:active{transform:scale(.98)}
.chip{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--edge);background:var(--glass-strong);color:var(--ink);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;box-shadow:inset 0 1px 0 var(--edge),0 6px 14px -8px var(--shadow);transition:background .2s,color .2s}
.chip.on{background:var(--plum);color:var(--bg);border-color:transparent}
.chip.ar{font-family:'Noto Naskh Arabic',serif;font-size:16px}
.load{height:4px;border-radius:2px;background:var(--lilac);overflow:hidden}
.load span{display:block;height:100%;width:40%;border-radius:2px;background:linear-gradient(90deg,var(--primary),var(--plum));animation:ld 1.6s ease-in-out infinite}
.float{animation:fl 5s ease-in-out infinite alternate}
.float2{animation:fl 6s ease-in-out 1s infinite alternate}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@keyframes fl{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(-10px) rotate(8deg)}}
a:focus-visible,button:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.load span,.float,.float2{animation:none}}
</style>
</helmet>
<div class="{{rootClass}}" style="width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box">
<div aria-hidden="true" style="position:absolute;inset:0;background:radial-gradient(60% 38% at 88% 6%,var(--bloom1),transparent 70%),radial-gradient(55% 32% at 0% 58%,var(--bloom2),transparent 70%),radial-gradient(60% 30% at 100% 100%,var(--bloom3),transparent 70%)"></div>

<div class="glass" style="position:absolute;left:32px;right:32px;top:52px;height:452px;border-radius:170px 170px 36px 36px;overflow:hidden">
<div style="position:absolute;inset:9px;border-radius:162px 162px 28px 28px;overflow:hidden;background:linear-gradient(180deg,var(--lav) 0%,var(--rose) 100%)">
<div aria-hidden="true" style="position:absolute;left:50%;top:-40px;width:360px;height:360px;margin-left:-180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.85) 0%,rgba(255,255,255,0) 65%)"></div>
<div aria-hidden="true" style="position:absolute;left:0;right:0;bottom:0;height:140px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.35))"></div>
<div style="position:absolute;left:50%;top:96px;margin-left:-118px">
<dc-import name="Art" kind="lotus" size="236" hint-size="236px,236px"></dc-import>
</div>
<div class="float" style="position:absolute;right:28px;top:72px">
<dc-import name="Art" kind="crystal" size="84" hint-size="84px,84px"></dc-import>
</div>
</div>
</div>

<div class="float2" style="position:absolute;left:6px;top:420px">
<dc-import name="Art" kind="crystal" size="96" hint-size="96px,96px"></dc-import>
</div>
<svg class="float" aria-hidden="true" width="26" height="26" viewBox="0 0 26 26" style="position:absolute;left:44px;top:118px"><path d="M13 2 C20 8 20 18 13 24 C6 18 6 8 13 2 Z" fill="#E7DAF4" stroke="#FFFFFF" stroke-width=".8"></path></svg>
<svg class="float2" aria-hidden="true" width="20" height="20" viewBox="0 0 26 26" style="position:absolute;right:30px;top:470px"><path d="M13 2 C20 8 20 18 13 24 C6 18 6 8 13 2 Z" fill="#EBD3E0" stroke="#FFFFFF" stroke-width=".8"></path></svg>

<div style="position:absolute;left:24px;right:24px;top:530px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">
<h1 class="serif" style="margin:0;font-size:36px;line-height:1.1;font-weight:600;color:var(--plum);letter-spacing:-.01em">Духтари хубам</h1>
<p style="margin:0;font-size:15px;line-height:1.4;color:var(--muted)">Ҳафт мактаби дониш</p>
<div class="load" role="progressbar" aria-label="Боркунӣ" style="width:120px;margin-top:6px"><span></span></div>
</div>

<div role="group" aria-label="Забон" style="position:absolute;left:24px;right:24px;top:654px;display:flex;justify-content:center;gap:8px">
<sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
<button type="button" class="{{l.cls}}" dir="{{l.dir}}" aria-pressed="{{l.pressed}}" onClick="{{l.pick}}">{{l.label}}</button>
</sc-for>
</div>

<a href="Home.dc.html" class="btn" style="position:absolute;left:40px;right:40px;top:722px">Оғоз
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
</a>
<a href="Home.dc.html" style="position:absolute;left:0;right:0;top:790px;text-align:center;font-size:14px;font-weight:500;color:var(--accent-ink);text-decoration:none;line-height:24px">Гузаштан</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: 'tg' };
  }
  renderVals() {
    const dark = !!this.props.dark;
    const list = [
      { id: 'tg', label: 'Тоҷикӣ', dir: 'ltr' },
      { id: 'ru', label: 'Русский', dir: 'ltr' },
      { id: 'ar', label: 'العربية', dir: 'rtl' }
    ];
    const langs = list.map((l) => {
      const on = this.state.lang === l.id;
      return {
        ...l,
        pressed: on ? 'true' : 'false',
        cls: 'chip' + (on ? ' on' : '') + (l.id === 'ar' ? ' ar' : ''),
        pick: () => this.setState({ lang: l.id })
      };
    });
    return { rootClass: dark ? 'dk dark' : 'dk', langs };
  }
}
</script>
</body>
</html>
