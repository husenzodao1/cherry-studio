name: Hamnavo APK

on:
  push:
    branches: [hamnavo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hamnavo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Unit tests and lint
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease

      - name: Keystore from secrets (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.HAMNAVO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HAMNAVO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HAMNAVO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HAMNAVO_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "HAMNAVO_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "HAMNAVO_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "HAMNAVO_KEY_ALIAS=$KEY_ALIAS"
              echo "HAMNAVO_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Using keystore from secrets"
          else
            echo "Using committed sideload keystore"
          fi

      - name: Build signed release APK and test APKs
        run: |
          ./gradlew --no-daemon assembleRelease assembleReleaseAndroidTest :tonegen:assembleDebug
          mkdir -p apks out
          cp app/build/outputs/apk/release/app-release.apk apks/
          cp app/build/outputs/apk/androidTest/release/app-release-androidTest.apk apks/
          cp tonegen/build/outputs/apk/debug/tonegen-debug.apk apks/
          cp app/build/outputs/apk/release/app-release.apk "out/Hamnavo-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: apks/

      - uses: actions/upload-artifact@v4
        with:
          name: Hamnavo-1.0.${{ github.run_number }}
          path: out/*.apk

  phones:
    name: phones-api${{ matrix.api-level }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Device tests on two emulators
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          cores: 2
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash ci/phones.sh ${{ matrix.api-level }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: phones-api${{ matrix.api-level }}
          path: ci-out/

      - name: Fail if device tests failed
        run: test ! -f ci-out/TESTS_FAILED

  release:
    needs: [build, phones]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Hamnavo-1.0.${{ github.run_number }}
          path: out

      # Created with GITHUB_TOKEN, so it does not trigger any other workflow of this repository.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "hamnavo-v1.0.${{ github.run_number }}" out/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.sha }}" \
            --title "Ҳамнаво 1.0.${{ github.run_number }}" \
            --notes "APK-и имзошуда барои Android 10+. Санҷишҳо дар ду эмулятор (API 29 ва 34) гузаштанд."
