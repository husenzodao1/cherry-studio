name: Coefficient Monitor (Android)

on:
  push:
    paths:
      - "coefficient-monitor-android/**"
      - ".github/workflows/coefficient-monitor-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coefficient-monitor-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: coefficient-monitor-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: coefficient-monitor-debug-apk
          path: coefficient-monitor-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Core unit tests (threshold rule, OCR parsing, round detection, calibration)
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon :core:test

      - name: App unit tests (Room/DataStore persistence, Robolectric)
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coefficient-monitor-android/core/build/reports/tests/
            coefficient-monitor-android/app/build/reports/tests/
          if-no-files-found: ignore

  emulator:
    name: emulator-api${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 34]
    defaults:
      run:
        working-directory: coefficient-monitor-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for the emulator
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and instrumentation APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Instrumented tests (real OCR, screen capture, end-to-end, UI)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          cores: 3
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: coefficient-monitor-android
          script: bash ci/run-emulator-tests.sh ${{ matrix.api-level }}

      - name: Upload emulator results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: emulator-api${{ matrix.api-level }}
          path: coefficient-monitor-android/ci-out/
          if-no-files-found: warn

      - name: Publish results to a review branch
        if: ${{ !cancelled() }}
        working-directory: coefficient-monitor-android/ci-out
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_LEVEL: ${{ matrix.api-level }}
        run: |
          echo "${GITHUB_SHA}" > COMMIT
          git init -q -b results
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Emulator results (API ${API_LEVEL}) for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "results:refs/heads/ci-results/coefmonitor-api${API_LEVEL}"

      - name: Fail the job if instrumented tests failed
        run: test ! -f ci-out/TESTS_FAILED
