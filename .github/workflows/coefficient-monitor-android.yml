name: Coefficient Monitor (Android)

on:
  push:
    paths:
      - "coefficient-monitor-android/**"
      - ".github/workflows/coefficient-monitor-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coefficient-monitor-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: coefficient-monitor-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: coefficient-monitor-debug-apk
          path: coefficient-monitor-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Core unit tests (threshold rule, OCR parsing, round detection, calibration)
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon :core:test

      - name: App unit tests (Room/DataStore persistence, Robolectric)
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coefficient-monitor-android/core/build/reports/tests/
            coefficient-monitor-android/app/build/reports/tests/
          if-no-files-found: ignore
